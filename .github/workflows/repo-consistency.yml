name: repo-consistency

# Layer 3: checks each product manifest against the repository it describes,
# and enforces that no product repository ships a competing Nextbridge
# marketplace. Needs the product repositories, so it runs on a schedule as well
# as on pull requests - product repositories change independently of this one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ecosystem

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecosystem/package-lock.json

      - run: npm ci
        working-directory: ecosystem

      # Shallow clone every indexed product. A repository that cannot be
      # cloned produces a `skipped` finding rather than a false pass.
      - name: Check out the indexed product repositories
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          repos=$(node -e "
            const yaml = require('./ecosystem/node_modules/js-yaml');
            const fs = require('node:fs');
            const r = yaml.load(fs.readFileSync('ecosystem/registry.yaml', 'utf8'));
            for (const p of Object.values(r.products)) console.log(p.repository);
          ")
          for repo in $repos; do
            name="${repo##*/}"
            if [ -d "$name" ]; then continue; fi
            gh repo clone "$repo" "$name" -- --depth 1 || echo "::warning::could not clone $repo"
          done

      - name: Repository consistency (layers 1-3)
        working-directory: ecosystem
        env:
          ECOSYSTEM_REPOS_DIR: ..
        run: |
          node scripts/validate.mjs --repos-dir ..
          npm run test:repos

      # The snapshots in manifests/ must still match the product repositories.
      - name: Synced manifests are current
        working-directory: ecosystem
        run: node scripts/sync.mjs --repos .. --check
