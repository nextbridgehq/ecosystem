schema: nextbridge.dev/product/v1

id: agent-loop-guard
name: Agent Loop Guard

description:
  short: >-
    Decision layer that catches an agent looping on the same tool call and says
    what to do about it.
  long: >-
    Wraps an existing tool-execution loop and decides, before each call, whether
    to allow it. It detects repeated calls, non-consecutive repeats inside a
    sliding window, repeated identical failures, stagnant results, and cycles
    between sequences of calls, and it enforces a total call budget, per-tool
    budgets, and a wall-clock ceiling. Every blocked decision carries a code, a
    suggested action, and a sentence the agent can be given directly. State
    serializes, so a run survives a process restart.

problem: >-
  A hard iteration limit stops a runaway agent from spending money but explains
  nothing: not which call looped, not whether results stopped changing, and not
  what the agent should do instead.

user:
  - ai-agent-developer

capabilities:
  core:
    - loop-detection
    - call-budget-enforcement

interfaces:
  - type: library
    package: agent-loop-guard
    language: javascript
    summary: >-
      Exports LoopGuard plus the signature helpers (callSignature,
      stableStringify, hashSignature). ESM only, no runtime dependencies, with
      hand-written .d.ts types checked against a consumer fixture under strict
      NodeNext.

distribution:
  - channel: npm
    packages:
      - agent-loop-guard
    access: public
  - channel: github
    repository: nextbridgehq/agent-loop-guard

runtime:
  language: javascript
  node: ">=18"

license: MIT

maturity: stable

# Deliberately framework-agnostic: it depends on no agent runtime and no model
# client, so it integrates with nothing by construction. Empty is the complete
# description, not a gap.
plugins: []

integrations: []
